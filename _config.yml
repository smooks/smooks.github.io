title: Smooks
theme: minima
asciidoc: {}
asciidoctor:
  base_dir: :docdir
  safe: unsafe
  attributes:
    - idseparator=_
    - source-highlighter=rouge
    - stylesdir=assets/css
    - allow-uri-read=
    - icons=font
plugins:
  - jekyll-redirect-from
  - asciidoctor-tabs
  - jekyll-feed
collections:
  blog:
    output: true
    permalink: /:collection/:year/:month/:day/:title/
feed:
  collections:
    blog:
      path: "/blog/feed.xml"