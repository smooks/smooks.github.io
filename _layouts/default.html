<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Smooks</title>

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,minimum-scale=1,maximum-scale=1" />
    <link rel="shortcut icon" href="{{ '/assets/images/smooks-favicon.png' | prepend: site.baseurl }}"/>
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | prepend: site.baseurl }}" type="text/css"/>
    <link rel="stylesheet" href="{{ '/assets/css/asciidoctor.css' | prepend: site.baseurl }}"/>
    <link rel="stylesheet" href="{{ '/assets/css/asciidoctor-tabs.css' | prepend: site.baseurl }}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" media="print" href="{{ '/assets/css/commonPrint.css' | prepend: site.baseurl }}" type="text/css"/>
    <link rel="stylesheet" media="print" href="{{ '/assets/css/gumax_print.css' | prepend: site.baseurl }}" type="text/css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tocbot/4.30.0/tocbot.css">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>

  <body >
    <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Smooks</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item active">
              <a class="nav-link" href="{{ '/index' | prepend: site.baseurl }}">Home <span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ '/documentation' | prepend: site.baseurl }}">Documentation</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ '/community' | prepend: site.baseurl }}">Community</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://github.com/smooks">GitHub</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ '/faq' | prepend: site.baseurl }}">FAQ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://github.com/smooks/smooks-examples/tree/v5">Examples</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ '/maven' | prepend: site.baseurl }}">Maven</a>
            </li>
          </ul>
        </div>
      </div>
      <a href="https://github.com/orgs/smooks/repositories"><img decoding="async" style="position: absolute; top: 0; right: 0; border: 0;" width="149" height="149" src="https://github.blog/wp-content/uploads/2008/12/forkme_right_green_007200.png?resize=149%2C149" class="attachment-full size-full" alt="Fork me on GitHub" loading="lazy" data-recalc-dims="1"></a>
    </nav>

    <div class="main container">
      <div class="row">
        {% if page.show-toc %}
        <!-- sidebar, which will move to the top on a small screen -->
        <div class="col-sm-3">
          <div id="side-toc" class="sticky-top"></div>
        </div>
        <div class="col-sm-9">.
          {{ content }}
        </div>
        {% else %}
          {{ content }}
        {% endif %}
      </div>
    </div>

    <!-- Bootstrap core JavaScript
    ================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="{{ '/assets/js/asciidoctor-tabs.js' | prepend: site.baseurl }}"></script>
    <script src="{{ '/assets/js/jquery-3.1.0.min.js' | prepend: site.baseurl }}"></script>
    <script src="{{ '/bootstrap/js/bootstrap.bundle.min.js' | prepend: site.baseurl }}"></script>
    <script src="{{ '/assets/js/smooks.js' | prepend: site.baseurl }}"></script>
    <script src="https://cdn.rawgit.com/afeld/bootstrap-toc/v1.0.1/dist/bootstrap-toc.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tocbot/4.30.0/tocbot.min.js"></script>
    <script>
      tocbot.init({
        tocSelector: '#side-toc',
        contentSelector: '.main',
        headingSelector: 'h2, h3, h4, h5, h5',
        includeTitleTags: true,
        enableUrlHashUpdateOnScroll: true,
        hasInnerContainers: false,
        headingsOffset: 70,
        scrollSmoothOffset: -70,
        scrollSmooth: false
      });
    </script>
  </body>
</html>
